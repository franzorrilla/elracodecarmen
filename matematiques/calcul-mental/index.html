<!doctype html><html lang="ca"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missió: càlcul mental · El racó de Carmen</title><link rel="stylesheet" href="../../assets/style.css"><style>.game{max-width:720px;margin:40px auto 90px;background:#fff;border:2px solid #25283a;border-radius:32px;padding:clamp(24px,6vw,55px);box-shadow:var(--shadow);text-align:center}.back{display:inline-block;margin:20px 0;font-weight:800;color:#694fa4}.progress{height:13px;border-radius:20px;background:#eee7fb;margin:25px 0;overflow:hidden}.progress>div{height:100%;width:0;background:#9475d4;transition:width .25s}.q{font:900 clamp(44px,9vw,75px) Nunito;margin:28px 0 20px}.answer{font-size:28px;width:100%;max-width:230px;padding:14px;border:2px solid #282839;border-radius:15px;text-align:center}.action{background:#25283a;color:white;border:0;padding:16px 25px;border-radius:35px;font-weight:900;margin-top:20px;cursor:pointer}.action:disabled{opacity:.4}.feedback{min-height:65px;font-weight:700;line-height:1.6;padding:15px}.score{font-size:60px;font-weight:900;color:#7656b7}.helper{border:0;background:none;color:#674da7;font-weight:800;text-decoration:underline;cursor:pointer;margin-top:16px}.small{font-size:13px;color:#686274}.game h1{font-size:39px}.hide{display:none}</style></head><body><header class="top"><a class="logo" href="../../">✳ <span>el racó de carmen</span></a><span class="tag">Un repte curtet</span></header><main class="wrap"><a class="back" href="../../">← Tornar al racó</a><section class="game"><div id="playing"><span class="eyebrow">MATEMÀTIQUES · REPTE DE 10 PREGUNTES</span><h1>Missió: càlcul mental 🧠</h1><p class="small" id="counter" aria-live="polite">Pregunta 1 de 10</p><div class="progress"><div id="bar"></div></div><div class="q" id="question">…</div><label for="answer">Quin és el resultat?</label><div><input id="answer" class="answer" type="number" inputmode="numeric" autocomplete="off"></div><button class="helper" id="hint" type="button">Necessite una pista</button><div class="feedback" id="feedback" aria-live="polite"></div><button class="action" id="check">Comprovar ↗</button></div><div id="finished" class="hide"><span class="eyebrow">MISSIÓ COMPLETADA</span><h1>Ho has aconseguit! ✨</h1><div class="score" id="score"></div><p>El més important no és encertar-ho tot, sinó practicar i entendre.</p><button class="action" id="restart">Tornar a jugar ↗</button><p><a class="back" href="../../">Tornar a les aventures</a></p></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let questions=[],idx=0,correct=0,locked=false;const random=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function make(){const kind=random(0,3);let a,b,operation,answer,hint;if(kind===0){a=random(15,95);b=random(10,85);operation=`${a} + ${b}`;answer=a+b;hint=`Descompon ${b} en desenes i unitats, i suma per parts.`}else if(kind===1){a=random(40,130);b=random(10,a);operation=`${a} − ${b}`;answer=a-b;hint=`Pots restar primer les desenes i després les unitats.`}else if(kind===2){a=random(2,9);b=random(3,12);operation=`${a} × ${b}`;answer=a*b;hint=`Pensa en ${a} grups de ${b}, o descompon un factor.`}else{b=random(2,9);answer=random(2,12);a=b*answer;operation=`${a} ÷ ${b}`;hint=`Quin nombre multiplicat per ${b} dona ${a}?`}return{operation,answer,hint}}function render(){locked=false;$('counter').textContent=`Pregunta ${idx+1} de 10`;$('bar').style.width=`${idx*10}%`;$('question').textContent=questions[idx].operation;$('answer').value='';$('answer').disabled=false;$('feedback').textContent='';$('check').textContent='Comprovar ↗';$('hint').disabled=false;$('answer').focus()}function start(){questions=Array.from({length:10},make);idx=0;correct=0;$('finished').classList.add('hide');$('playing').classList.remove('hide');render()}$('hint').onclick=()=>{$('feedback').textContent=questions[idx].hint};$('check').onclick=()=>{if(locked){idx++;if(idx===10){$('playing').classList.add('hide');$('finished').classList.remove('hide');$('score').textContent=`${correct}/10`;return}render();return}const value=$('answer').value.trim();if(!value){$('feedback').textContent='Escriu una resposta primer.';return}const right=Number(value)===questions[idx].answer;if(right)correct++;$('feedback').textContent=right?'Molt bé! Has trobat la resposta. ⭐':`Bon intent! El resultat és ${questions[idx].answer}. Pensa com podries arribar-hi.`;$('bar').style.width=`${(idx+1)*10}%`;$('answer').disabled=true;$('hint').disabled=true;locked=true;$('check').textContent=idx===9?'Vore el resultat ↗':'Següent pregunta →'};$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});$('restart').onclick=start;start()})();
</script></body></html>
