function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let round=[],n=0,score=0,wrong=[],seen=new Set();
function screen(s){['menu','game','end'].forEach(x=>$(x).hidden=x!==s)}
function start(custom){let pool=bank.filter(x=>$('topic').value==='all'||x.cat===$('topic').value||($('topic').value==='forms'&&['negative','question','short'].includes(x.cat)));round=custom?mix(custom):[...mix(pool.filter(x=>!seen.has(x))),...mix(pool.filter(x=>seen.has(x)))].slice(0,+$('size').value);n=0;score=0;wrong=[];screen('game');render()}
