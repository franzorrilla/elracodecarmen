<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica Present Simple + Present Continuous · Carmen</title><style>*{box-sizing:border-box}body{background:#fff9ef;color:#343248;font:17px system-ui;margin:0}main{max-width:580px;margin:auto;padding:22px 16px}button,select{font:inherit;padding:16px;border:2px solid #d9cce5;border-radius:16px;background:white;color:inherit;min-height:52px}button{cursor:pointer}button:focus-visible{outline:3px solid #77529e}h1{font-size:clamp(24px,6vw,32px);line-height:1.25;overflow-wrap:anywhere}h2{line-height:1.5}section{background:white;border-radius:24px;padding:22px;margin:20px 0}#answers{display:grid;gap:12px}#answers button{text-align:left}p{line-height:1.6}.primary{background:#74519a;color:white;width:100%;margin-top:18px}.good{background:#dff0dc!important}.bad{background:#ffebdf!important}[hidden]{display:none!important}select{width:100%;margin:10px 0}a{color:#74519a}#feedback{background:#f1e9fa;padding:16px;border-radius:12px}</style><main><a href="../">← Inglés</a><h1>Práctica Present Simple + Present Continuous</h1><div id="menu"><p>108 ejercicios para practicar sin escribir. ¡Sin prisas!</p><label>Elige un bloque<select id="topic"><option value="all">Un poco de todo</option><option value="simple">Present simple</option><option value="continuous">Present continuous</option><option value="sports">Deportes · Sports (36 ejercicios)</option><option value="ing">Verbos con -ing</option></select></label><label>Tamaño de la tanda<select id="size"><option>10</option><option>5</option><option>20</option></select></label><button class="primary" id="start">Empezar →</button></div><section id="game" hidden><p id="progress"></p><p>Elige la opción correcta:</p><h2 id="question" lang="en"></h2><div id="answers"></div><details id="hint"><summary>💡 Una pista</summary><p id="clue"></p></details><p id="feedback" aria-live="polite" hidden></p><button class="primary" id="next" hidden>Siguiente →</button></section><section id="end" hidden><h2>🌟 ¡Tanda terminada!</h2><p id="result"></p><button id="retry">Repetir mis fallos</button><button id="again" class="primary">Otra tanda</button><button id="back" class="primary">Elegir bloque</button></section></main><script>
const $=id=>document.getElementById(id),bank=[];
function add(cat,q,a,w,h,e){bank.push({cat,q,a,options:[a,...w],h,e})}
const verbs=[['play','plays','playing','tennis'],['read','reads','reading','a book'],['swim','swims','swimming','in the pool'],['dance','dances','dancing','at home'],['run','runs','running','in the park'],['cook','cooks','cooking','dinner'],['watch','watches','watching','TV'],['eat','eats','eating','lunch'],['draw','draws','drawing','a picture'],['write','writes','writing','a story']];
verbs.forEach(([v,s,g,o])=>{
add('simple','She ___ '+o+' every Saturday.',s,[v,'is '+g,g],'Every Saturday indica una rutina.','Con she, la afirmativa del present simple lleva -s o -es: '+s+'.');
add('simple','They ___ '+o+' every week.',v,[s,'are '+g,g],'El sujeto es they y hablamos de una rutina.','Con they usamos el verbo sin -s: '+v+'.');
add('simple','He doesn’t ___ '+o+' on Mondays.',v,[s,g,'is '+g],'El auxiliar doesn’t ya está escrito.','Después de doesn’t, el verbo no lleva -s: '+v+'.');
add('continuous','Look! She ___ '+o+'.','is '+g,[s,g,'are '+g],'Look: mira lo que está ocurriendo.','She + is + verbo en -ing.');
add('continuous','They ___ '+o+' right now.','are '+g,[s,g,'is '+g],'Right now significa ahora mismo.','They + are + verbo en -ing.');
add('continuous','___ he '+g+' '+o+' now?','Is',['Does','Do','Are'],'Es una pregunta con he y un verbo en -ing.','En present continuous, Is va delante de he.');
});
[['run','running','runing','runn'],['swim','swimming','swiming','swim'],['sit','sitting','siting','sit'],['stop','stopping','stoping','stop'],['shop','shopping','shoping','shop'],['get','getting','geting','get'],['dance','dancing','danceing','danncing'],['write','writing','writeing','writting'],['make','making','makeing','makking'],['play','playing','playying','plaing'],['read','reading','readding','reding'],['jump','jumping','jumpping','jumpying']].forEach(([v,a,b,c],i)=>add('ing',v+' + -ing = ?',a,[b,c,v+'s'],i<6?'La última consonante tiene una gemela.':i<9?'La e final desaparece.':'Solo añade -ing, sin duplicar.',i<6?'Se duplica la última consonante: '+a+'.':i<9?'Quita la e final y añade -ing: '+a+'.':'No se duplica ninguna consonante: '+a+'.'));
const sportsQuestions=[{"q":"¿Cómo se dice «fútbol» en inglés?","a":"football","w":["basketball","swimming","volleyball"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"football significa fútbol."},{"q":"¿Cómo se dice «baloncesto» en inglés?","a":"basketball","w":["tennis","cycling","badminton"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"basketball significa baloncesto."},{"q":"¿Cómo se dice «tenis» en inglés?","a":"tennis","w":["swimming","volleyball","gymnastics"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"tennis significa tenis."},{"q":"¿Cómo se dice «natación» en inglés?","a":"swimming","w":["cycling","badminton","karate"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"swimming significa natación."},{"q":"¿Cómo se dice «ciclismo» en inglés?","a":"cycling","w":["volleyball","gymnastics","athletics"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"cycling significa ciclismo."},{"q":"¿Cómo se dice «voleibol» en inglés?","a":"volleyball","w":["badminton","karate","ice skating"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"volleyball significa voleibol."},{"q":"¿Cómo se dice «bádminton» en inglés?","a":"badminton","w":["gymnastics","athletics","table tennis"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"badminton significa bádminton."},{"q":"¿Cómo se dice «gimnasia» en inglés?","a":"gymnastics","w":["karate","ice skating","football"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"gymnastics significa gimnasia."},{"q":"¿Cómo se dice «kárate» en inglés?","a":"karate","w":["athletics","table tennis","basketball"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"karate significa kárate."},{"q":"¿Cómo se dice «atletismo» en inglés?","a":"athletics","w":["ice skating","football","tennis"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"athletics significa atletismo."},{"q":"¿Cómo se dice «patinaje sobre hielo» en inglés?","a":"ice skating","w":["table tennis","basketball","swimming"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"ice skating significa patinaje sobre hielo."},{"q":"¿Cómo se dice «tenis de mesa» en inglés?","a":"table tennis","w":["football","tennis","cycling"],"h":"Piensa en el nombre de este deporte, no en su material.","e":"table tennis significa tenis de mesa."},{"q":"I ___ football on Saturdays.","a":"play","w":["go","do","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «play football». Usamos play con estos juegos y deportes."},{"q":"I ___ tennis on Saturdays.","a":"play","w":["go","do","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «play tennis». Usamos play con estos juegos y deportes."},{"q":"I ___ basketball on Saturdays.","a":"play","w":["go","do","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «play basketball». Usamos play con estos juegos y deportes."},{"q":"I ___ volleyball on Saturdays.","a":"play","w":["go","do","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «play volleyball». Usamos play con estos juegos y deportes."},{"q":"I ___ badminton on Saturdays.","a":"play","w":["go","do","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «play badminton». Usamos play con estos juegos y deportes."},{"q":"I ___ table tennis on Saturdays.","a":"play","w":["go","do","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «play table tennis». Usamos play con estos juegos y deportes."},{"q":"I ___ swimming on Saturdays.","a":"go","w":["play","do","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «go swimming». Esta actividad se combina con go."},{"q":"I ___ cycling on Saturdays.","a":"go","w":["play","do","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «go cycling». Esta actividad se combina con go."},{"q":"I ___ ice skating on Saturdays.","a":"go","w":["play","do","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «go ice skating». Esta actividad se combina con go."},{"q":"I ___ running on Saturdays.","a":"go","w":["play","do","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «go running». Esta actividad se combina con go."},{"q":"I ___ karate on Saturdays.","a":"do","w":["play","go","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «do karate». Esta disciplina se combina con do."},{"q":"I ___ gymnastics on Saturdays.","a":"do","w":["play","go","make"],"h":"Piensa qué verbo acompaña a este deporte.","e":"Decimos «do gymnastics». Esta disciplina se combina con do."},{"q":"¿Qué significa «racket»?","a":"raqueta","w":["casco","portería","piscina"],"h":"Busca el significado de esta palabra deportiva.","e":"Racket significa raqueta: se utiliza, por ejemplo, en tenis."},{"q":"¿Qué significa «helmet»?","a":"casco","w":["pelota","red","raqueta"],"h":"Busca el significado de esta palabra deportiva.","e":"Helmet significa casco. Se usa para proteger la cabeza."},{"q":"¿Qué significa «ball»?","a":"pelota","w":["bicicleta","pista","equipo"],"h":"Busca el significado de esta palabra deportiva.","e":"Ball significa pelota o balón."},{"q":"¿Qué significa «team»?","a":"equipo","w":["entrenador","raqueta","portería"],"h":"Busca el significado de esta palabra deportiva.","e":"Team significa equipo."},{"q":"¿Qué significa «swimming pool»?","a":"piscina","w":["pista de tenis","campo de fútbol","gimnasio"],"h":"Busca el significado de esta palabra deportiva.","e":"Swimming pool significa piscina."},{"q":"¿Qué significa «goalkeeper»?","a":"portero/a","w":["árbitro/a","entrenador/a","nadador/a"],"h":"Busca el significado de esta palabra deportiva.","e":"Goalkeeper es quien defiende la portería."},{"q":"You kick a ball into a goal. Which sport is it?","a":"football","w":["swimming","gymnastics","cycling"],"h":"Busca la pista del material o del lugar.","e":"Kick significa dar una patada y goal, portería: hablamos de football."},{"q":"You use a racket and a shuttlecock. Which sport is it?","a":"badminton","w":["football","basketball","swimming"],"h":"Busca la pista del material o del lugar.","e":"En badminton se usan una raqueta y un volante (shuttlecock)."},{"q":"You ride a bike. Which sport is it?","a":"cycling","w":["tennis","karate","volleyball"],"h":"Busca la pista del material o del lugar.","e":"Ride a bike significa ir en bicicleta: cycling."},{"q":"You throw a ball into a basket. Which sport is it?","a":"basketball","w":["football","swimming","ice skating"],"h":"Busca la pista del material o del lugar.","e":"Basket es canasta. En basketball intentamos encestar."},{"q":"You swim in a pool. Which sport is it?","a":"swimming","w":["cycling","tennis","athletics"],"h":"Busca la pista del material o del lugar.","e":"Swim significa nadar: el deporte es swimming."},{"q":"You skate on ice. Which sport is it?","a":"ice skating","w":["football","badminton","gymnastics"],"h":"Busca la pista del material o del lugar.","e":"Ice significa hielo: ice skating es patinaje sobre hielo."}];
sportsQuestions.forEach(x=>add('sports',x.q,x.a,x.w,x.h,x.e));
function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let round=[],n=0,score=0,wrong=[],seen=new Set();
function screen(s){['menu','game','end'].forEach(x=>$(x).hidden=x!==s)}
function start(custom){let pool=bank.filter(x=>$('topic').value==='all'||x.cat===$('topic').value);round=custom?mix(custom):[...mix(pool.filter(x=>!seen.has(x))),...mix(pool.filter(x=>seen.has(x)))].slice(0,+$('size').value);n=0;score=0;wrong=[];screen('game');render()}
function render(){let q=round[n],locked=false;seen.add(q);$('progress').textContent=(n+1)+' / '+round.length;$('question').textContent=q.q;$('clue').textContent=q.h;$('hint').open=false;$('feedback').hidden=true;$('next').hidden=true;$('answers').replaceChildren();mix(q.options).forEach(a=>{let b=document.createElement('button');b.textContent=a;b.lang='en';b.onclick=()=>{if(locked)return;locked=true;let ok=a===q.a;if(ok)score++;else wrong.push(q);for(let t of $('answers').children){t.disabled=true;if(t.textContent===q.a)t.className='good'}if(!ok)b.className='bad';$('feedback').textContent=(ok?'🌟 ¡Bien! ':'🌱 La respuesta es '+q.a+'. ')+q.e;$('feedback').hidden=false;$('next').hidden=false;};$('answers').append(b)})}
$('start').onclick=()=>start();$('next').onclick=()=>{if(++n<round.length)render();else{screen('end');$('result').textContent=score+' de '+round.length+' a la primera. ¡Cada intento ayuda a aprender!';$('retry').hidden=!wrong.length}};$('retry').onclick=()=>start([...wrong]);$('again').onclick=()=>start();$('back').onclick=()=>screen('menu');
</script></html>
